<div class="editar-treino">
  <h3>Editar Treino</h3>
  <form [formGroup]="form">
    <mat-form-field>
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" />
      <mat-error *ngIf="form.get('nome')?.invalid">Nome é obrigatório.</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="descricao"></textarea>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Limite de Alunos</mat-label>
      <input matInput type="number" formControlName="limiteAlunos" />
      <mat-error *ngIf="form.get('limiteAlunos')?.invalid">Informe um limite válido.</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Data de Vencimento</mat-label>
      <input matInput type="date" formControlName="dataVencimento" />
    </mat-form-field>
  </form>

  <div class="botoes">
    <button (click)="salvar()">Salvar</button>
    <button (click)="fechar()">Cancelar</button>
  </div>
</div>
