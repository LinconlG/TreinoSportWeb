<div class="perfil-container">
  <h2>Meu Perfil</h2>

  <form [formGroup]="form" (ngSubmit)="salvar()">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" placeholder="Nome">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" placeholder="Email">
    </mat-form-field>

    @if (isCT) {
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descrição</mat-label>
        <textarea matInput formControlName="descricao" rows="4" placeholder="Descrição do centro de treinamento"></textarea>
      </mat-form-field>
    }

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nova Senha (opcional)</mat-label>
      <input matInput formControlName="senha" type="password" placeholder="Deixe em branco para não alterar">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Senha Atual (obrigatória para alterar email ou senha)</mat-label>
      <input matInput formControlName="senhaAtual" type="password" placeholder="Senha atual">
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="carregando">
      {{ carregando ? 'Salvando...' : 'Salvar' }}
    </button>

  </form>
</div>
