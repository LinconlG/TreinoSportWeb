<form [formGroup]="form">
  <div class="cadastro-div">

    <img src="assets/images/logo.png" alt="Logo" class="logo-img">

    <div class="checkbox-div">
      <input formControlName="isCentroTreinamento" type="checkbox" class="checkbox">
      <label for="checkbox" class="label-checkbox">Criar conta para Centro de treinamento</label>
    </div>


    <div class="input-cadastro">

      <input formControlName="nome" type="text" placeholder="Nome">
      <span class="erro-campo" *ngIf="form.get('nome')?.invalid && (form.get('nome')?.dirty || form.get('nome')?.touched)">
        Nome é obrigatório.
      </span>

      <input formControlName="email" type="email" placeholder="Email">
      <span class="erro-campo" *ngIf="form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)">
        <span *ngIf="form.get('email')?.errors?.['required']">Email é obrigatório.</span>
        <span *ngIf="form.get('email')?.errors?.['email']">Email inválido.</span>
      </span>

      <input formControlName="senha" type="password" placeholder="Senha">
      <span class="erro-campo" *ngIf="form.get('senha')?.invalid && (form.get('senha')?.dirty || form.get('senha')?.touched)">
        <span *ngIf="form.get('senha')?.errors?.['required']">Senha é obrigatória.</span>
        <span *ngIf="form.get('senha')?.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres.</span>
      </span>

      <div *ngIf="form.get('isCentroTreinamento')?.value">
        <textarea formControlName="descricao" class="richText" type="text" placeholder="Descrição"></textarea>

        <input formControlName="cep" type="text" placeholder="CEP (ex: 00000-000)">

        <div class="localizacao-div">
          <input formControlName="latitude" type="number" placeholder="Latitude (opcional)">
          <input formControlName="longitude" type="number" placeholder="Longitude (opcional)">
          <button type="button" (click)="usarLocalizacao()">📍 Usar minha localização</button>
        </div>
      </div>
    </div>

    <label class="label-voltar">Já possui uma conta? <a href="/login">Clique aqui</a></label>

    <button class="botao" (click)="cadastrar()">Cadastrar</button>
  </div>
</form>
